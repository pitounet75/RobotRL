<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>RobotRL Telemetry</title>
    <link rel="stylesheet" href="vendor/uplot/uPlot.min.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>RobotRL Telemetry</h1>
      <div class="header-right">
        <button id="preset-save">Save</button>
        <button id="preset-load">Load</button>
        <span id="connection-status" class="status-bad">disconnected</span>
      </div>
    </header>
    <div id="preset-overlay" hidden>
      <div class="preset-panel" role="dialog" aria-modal="true">
        <h2 id="preset-overlay-title">Save preset</h2>
        <ul id="preset-list"></ul>
        <p id="preset-empty" class="preset-empty" hidden>No presets yet.</p>
        <div id="preset-create-row">
          <input id="preset-name" type="text" maxlength="80" placeholder="New preset name" />
          <button id="preset-create">Create</button>
        </div>
        <button id="preset-close" type="button">Close</button>
      </div>
    </div>

    <main>
      <section id="charts">
        <div id="chart-pitch" class="chart"></div>
        <div id="chart-torque" class="chart"></div>
        <div id="chart-velocity" class="chart"></div>
        <div id="chart-accel" class="chart"></div>
        <div id="chart-flags" class="chart"></div>
      </section>

      <div id="chart-controls" class="control-block">
        <label for="window-slider">Time window</label>
        <input type="range" id="window-slider" min="2" max="30" value="10" step="1" />
        <span id="window-label">10 s</span>
        <button id="freeze-toggle">Freeze</button>
      </div>

      <section id="controls">
        <div class="control-block drive-block">
          <span class="drive-hint">↑↓ speed · ←→ yaw — hold to ramp, release to brake</span>
          <label for="drive-max-mps">Max speed</label>
          <input id="drive-max-mps" type="number" min="0.01" max="4" step="0.05" value="0.50" />
          <span>m/s</span>
          <label for="drive-max-yaw">Max yaw</label>
          <input id="drive-max-yaw" type="number" min="1" max="229" step="5" value="45" />
          <span>°/s</span>
          <span id="speed-label">+0.00 m/s (+0.000 motor turn/s)</span>
          <span id="heading-label">yaw +0.00 rad/s (+0 °/s)</span>
          <span class="vbus-wrap">
            <span id="vbus-lamp" class="vbus-lamp" title="Vbus: orange &lt; 11.4 V, rouge clignotant &lt; 11 V"></span>
            <span id="vbus-label">Vbus L — V · R — V</span>
          </span>
          <span class="sync-wrap" title="Vert = cette roue en SYNC / BOTH_AIR, rouge = NORMAL / RECOVERY">
            <span id="sync-l-lamp" class="sync-lamp normal"></span>
            <span>sync_l</span>
            <span id="sync-r-lamp" class="sync-lamp normal"></span>
            <span>sync_r</span>
          </span>
          <button id="drive-zero">0</button>
        </div>

        <div class="control-block">
          <button id="gains-refresh">Refresh from robot</button>
          <button id="gains-apply-changed">Apply changed</button>
          <button id="gains-apply-all">Apply all</button>
          <button id="gains-pos-reset">pos_reset</button>
          <button id="gains-heading-reset">heading_reset</button>
          <span id="gains-status"></span>
        </div>
        <div id="gains-form"></div>
      </section>
    </main>

    <script src="vendor/uplot/uPlot.iife.min.js"></script>
    <script src="app.js" defer></script>
    <script src="control.js" defer></script>
  </body>
</html>
