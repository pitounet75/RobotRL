# Wrapper for STM32H743VIT6 + ST-Link DAP (OpenOCD 0.12+).
# Use with interface/stlink-dap.cfg (not stlink.cfg / HLA).
set AP_NUM 0
set STOP_WATCHDOG 1
set CONNECT_UNDER_RESET 0
source [find target/stm32h7x.cfg]

# reset init / reset halt time out on this board; halt works reliably.
proc first_gdb_attach_hook {} {
  catch { halt }
}
