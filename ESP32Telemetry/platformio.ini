; ESP32 UART <-> UDP bridge for RobotRL telemetry

[env:esp32dev]
platform = espressif32 @ 7.0.1
board = esp32dev
framework = arduino
monitor_speed = 115200
; Arduino-ESP32 is precompiled: sdkconfig overrides here do not rebuild lwIP/WiFi.
; Keep the framework defaults (including AMPDU) and handle ENOMEM with bounded retry.
build_flags =
    -DCORE_DEBUG_LEVEL=0
