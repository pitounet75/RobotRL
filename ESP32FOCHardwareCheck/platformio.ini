; One-axis FS2804 + MT6835 hardware check. Same core as ESP32FOC.
; Default env = left wheel. Unused axis: CS high, PWM held low.
;
; WiFi creds are NOT here (kept out of git). Put them in a gitignored
; platformio.local.ini next to this file, overriding ONLY the [wifi]
; section below (never [env].build_flags directly — PlatformIO REPLACES,
; not merges, a build_flags key redefined in an extra_configs file, which
; silently dropped FOC_VBUS and every other flag here for a while):
;   [wifi]
;   build_flags =
;       -DWIFI_SSID=\"yourssid\"
;       -DWIFI_PASS=\"yourpass\"
; Without it, WIFI_SSID/WIFI_PASS default to "" (config.h) and the board
; falls back to its own AP (see README).
[platformio]
extra_configs = *.local.ini

[wifi]
build_flags =

[env]
platform = espressif32 @ 7.0.1
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
extra_scripts = post:scripts/wrap_uploader.py
lib_deps =
    askuric/Simple FOC @ 2.3.3
lib_archive = false
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DFOC_POLE_PAIRS=7
    -DENC_PPR=16384
    -DFOC_VBUS=12.6
    ${wifi.build_flags}

[env:left]
build_flags =
    ${env.build_flags}
    -DMOTOR_AXIS=0

[env:right]
build_flags =
    ${env.build_flags}
    -DMOTOR_AXIS=1

; Normal flash = OTA. Set upload_port to the STA IP from `ota` / boot log.
; USB esptool is only if the app is dead (do not short IO0 pads).
[env:left_ota]
extends = left
upload_protocol = espota
upload_port = 192.168.1.1

[env:right_ota]
extends = right
upload_protocol = espota
upload_port = 192.168.1.1
