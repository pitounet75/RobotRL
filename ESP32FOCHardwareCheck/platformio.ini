; One-axis FS2804 + MT6835 hardware check. Same core as ESP32FOC.
; Default env = left wheel. Unused axis: CS high, PWM held low.
;
; WiFi creds are NOT here (kept out of git). Put them in a gitignored
; platformio.local.ini next to this file:
;   [env]
;   build_flags =
;       -DWIFI_SSID=\"yourssid\"
;       -DWIFI_PASS=\"yourpass\"
; Without it, WIFI_SSID/WIFI_PASS default to "" (config.h) and the board
; falls back to its own AP (see README).
[platformio]
extra_configs = *.local.ini

[env]
platform = espressif32 @ 7.0.1
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
extra_scripts = post:scripts/wrap_uploader.py
lib_deps =
    askuric/Simple FOC @ 2.3.3
lib_archive = false
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DFOC_POLE_PAIRS=7
    -DENC_PPR=16384
    -DFOC_VBUS=12.6

[env:left]
build_flags =
    ${env.build_flags}
    -DMOTOR_AXIS=0

[env:right]
build_flags =
    ${env.build_flags}
    -DMOTOR_AXIS=1

; USB once (R13), then OTA on the box. Replace upload_port with the STA IP
; printed at boot: ota: STA ORBI44  ip=192.168.x.x
[env:left_ota]
extends = left
upload_protocol = espota
upload_port = 192.168.1.1

[env:right_ota]
extends = right
upload_protocol = espota
upload_port = 192.168.1.1
