; Dual-gimbal balancer: ESP32 + 2×2804 + 2×MT6835 + ICM45686.
; Same espressif32 7.0.1 as ESP32MT6835Setup. SimpleFOC 2.3.3 (not 2.3.4).

[env]
platform = espressif32 @ 7.0.1
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    askuric/Simple FOC @ 2.3.3
lib_archive = false
build_flags =
    -DCORE_DEBUG_LEVEL=0

[env:esp32dev]
build_flags =
    ${env.build_flags}
    -DFOC_MODE=0

[env:openloop]
build_flags =
    ${env.build_flags}
    -DFOC_MODE=1

[env:foc]
build_flags =
    ${env.build_flags}
    -DFOC_MODE=2

[env:balance]
build_flags =
    ${env.build_flags}
    -DFOC_MODE=3
