; MT6835 SPI tools.
; Default env = read-only EEPROM dump (safe).
; Loopback env = ESP32 self-test only (jumper MOSI<->MISO, no encoder).
; write env = volatile ABZ change only (still no EEPROM burn by default).

[env:esp32dev]
platform = espressif32 @ 7.0.1
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter = +<*> -<loopback.cpp> -<angle.cpp> -<odrive_match.cpp> -<autocal.cpp>
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DMT6835_MODE_DUMP=1
    -DMT6835_ALLOW_WRITE=0
    -DMT6835_PROGRAM_EEPROM=0

[env:probe]
platform = espressif32 @ 7.0.1
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter = +<*> -<loopback.cpp> -<angle.cpp> -<odrive_match.cpp> -<autocal.cpp>
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DMT6835_MODE_DUMP=0
    -DMT6835_ALLOW_WRITE=0
    -DMT6835_PROGRAM_EEPROM=0

[env:write]
platform = espressif32 @ 7.0.1
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter = +<*> -<loopback.cpp> -<angle.cpp> -<odrive_match.cpp> -<autocal.cpp>
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DMT6835_MODE_DUMP=0
    -DMT6835_ALLOW_WRITE=1
    -DMT6835_ABZ_PPR=16384
    -DMT6835_PROGRAM_EEPROM=0

; Full-map restore onto CS0 from include/mt6835_restore_map.h (dump_to_restore_map.py).
; Unplug the donor first — CS0 is the chip that will be written.
[env:restore]
platform = espressif32 @ 7.0.1
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter = +<*> -<loopback.cpp> -<angle.cpp> -<odrive_match.cpp> -<autocal.cpp>
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DMT6835_MODE_DUMP=0
    -DMT6835_RESTORE=1
    -DMT6835_PROGRAM_EEPROM=0

[env:restore_burn]
platform = espressif32 @ 7.0.1
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter = +<*> -<loopback.cpp> -<angle.cpp> -<odrive_match.cpp> -<autocal.cpp>
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DMT6835_MODE_DUMP=0
    -DMT6835_RESTORE=1
    -DMT6835_PROGRAM_EEPROM=1

[env:loopback]
platform = espressif32 @ 7.0.1
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter = +<loopback.cpp>
build_flags =
    -DCORE_DEBUG_LEVEL=0

; Read-only angle print every 500 ms (no EEPROM access).
; 5 MHz ≈ ODrive SPI3 (42 MHz / 8). Dump/write/PROG stay at 400 kHz.
[env:angle]
platform = espressif32 @ 7.0.1
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter = +<angle.cpp> +<mt6835.cpp>
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DMT6835_ALLOW_WRITE=0
    -DMT6835_PROGRAM_EEPROM=0
    -DMT6835_SPI_HZ=5000000

; Stress monitor that mimics the ODrive_S encoder path: 2.625 MHz (SPI3 42 MHz/16,
; fw c6b6fdf), 6-byte burst @0x003, same CRC-8, polled at 8 kHz with an
; ODrive-style low-pass on the failure rate (printed spi_err ~ odrv0 spi_error_rate).
; Test from a COLD ESP32. Override SPI_HZ=5250000 to check the old /8 rate.
[env:odrive_match]
platform = espressif32 @ 7.0.1
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter = +<odrive_match.cpp> +<mt6835.cpp>
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DMT6835_ALLOW_WRITE=0
    -DMT6835_PROGRAM_EEPROM=0
    -DMT6835_SPI_HZ=2625000

; --- MT6835 User Auto-Calibration (src/autocal.cpp) -------------------------
; Spin the shaft open-loop from the ODrive (encoder.config.mode=0, LOCKIN_SPIN)
; at a mech RPM inside the AUTOCAL_FREQ window (factory default 0x3 = 400-800).
; Registers are confirmed against MT6835 Rev 1.3: status 0x113[7:6],
; AUTOCAL_FREQ 0x00E[6:4]. Trigger = pin 4 (CAL_EN) to VDD; the SPI trigger
; 0x155<-0x5E is documented only for the sibling MT6826S and is attempted as
; the no-solder path. Auto-cal saves itself - no PROG.
;
; autocal      : dump the EEPROM map (backup) + decode the regs. No writes.
[env:autocal]
platform = espressif32 @ 7.0.1
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter = +<autocal.cpp> +<mt6835.cpp>
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DMT6835_ALLOW_WRITE=0
    -DMT6835_AUTOCAL_RUN=0

; autocal_run  : trigger (0x155<-0x5E and/or CAL_EN pin) + poll 0x113 + clean up.
;                Volatile. Add -DMT6835_AUTOCAL_FREQ_CODE=N to force a window,
;                -DMT6835_PIN_CAL_EN=<gpio> if pin 4 is wired to the ESP32.
[env:autocal_run]
platform = espressif32 @ 7.0.1
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter = +<autocal.cpp> +<mt6835.cpp>
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DMT6835_ALLOW_WRITE=1
    -DMT6835_AUTOCAL_RUN=1
    -DMT6835_AUTOCAL_USE_REG_TRIGGER=1
