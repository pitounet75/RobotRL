; MT6835 SPI tools.
; Default env = read-only EEPROM dump (safe).
; Loopback env = ESP32 self-test only (jumper MOSI<->MISO, no encoder).
; write env = volatile ABZ change only (still no EEPROM burn by default).

[env:esp32dev]
platform = espressif32 @ 7.0.1
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter = +<*> -<loopback.cpp> -<angle.cpp>
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DMT6835_MODE_DUMP=1
    -DMT6835_ALLOW_WRITE=0
    -DMT6835_PROGRAM_EEPROM=0

[env:probe]
platform = espressif32 @ 7.0.1
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter = +<*> -<loopback.cpp> -<angle.cpp>
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DMT6835_MODE_DUMP=0
    -DMT6835_ALLOW_WRITE=0
    -DMT6835_PROGRAM_EEPROM=0

[env:write]
platform = espressif32 @ 7.0.1
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter = +<*> -<loopback.cpp> -<angle.cpp>
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DMT6835_MODE_DUMP=0
    -DMT6835_ALLOW_WRITE=1
    -DMT6835_ABZ_PPR=16384
    -DMT6835_PROGRAM_EEPROM=0

; Full-map restore onto CS0 from include/mt6835_restore_map.h (dump_to_restore_map.py).
; Unplug the donor first — CS0 is the chip that will be written.
[env:restore]
platform = espressif32 @ 7.0.1
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter = +<*> -<loopback.cpp> -<angle.cpp>
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DMT6835_MODE_DUMP=0
    -DMT6835_RESTORE=1
    -DMT6835_PROGRAM_EEPROM=0

[env:restore_burn]
platform = espressif32 @ 7.0.1
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter = +<*> -<loopback.cpp> -<angle.cpp>
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DMT6835_MODE_DUMP=0
    -DMT6835_RESTORE=1
    -DMT6835_PROGRAM_EEPROM=1

[env:loopback]
platform = espressif32 @ 7.0.1
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter = +<loopback.cpp>
build_flags =
    -DCORE_DEBUG_LEVEL=0

; Read-only angle print every 500 ms (no EEPROM access).
; 5 MHz ≈ ODrive SPI3 (42 MHz / 8). Dump/write/PROG stay at 400 kHz.
[env:angle]
platform = espressif32 @ 7.0.1
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter = +<angle.cpp> +<mt6835.cpp>
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DMT6835_ALLOW_WRITE=0
    -DMT6835_PROGRAM_EEPROM=0
    -DMT6835_SPI_HZ=5000000
